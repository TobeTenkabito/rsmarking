<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent workspace test</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9eee9}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}button{border:0}textarea{font:inherit}.flex{display:flex}.gap-2{gap:8px}.flex-wrap{flex-wrap:wrap}.mb-2{margin-bottom:8px}p,h1,h2,h3{margin:0}</style></head><body>
<script type="module">
import { aiModal } from '/client/packages/ui/src/templates/modals/aiModal.js';
import { AIModule } from '/client/packages/app/src/modules/AIModule.js';
import { AIAPI } from '/client/packages/app/src/api/ai.js';
import { setLanguage, applyTranslations } from '/client/packages/app/src/i18n/index.js';
setLanguage('zh');
document.body.innerHTML = aiModal;
const records = new Map([
 ['a'.repeat(32), {archive_id:'a'.repeat(32),session_id:'old-a',title:'城市水体分布分析',updated_at:'2026-11-11T08:00:00Z',messages:[{role:'user',content:'帮我分析这幅影像的水体分布。'},{role:'assistant',content:'## 水体分析结果\n\n主要水体沿河流分布，建议结合 **MNDWI** 与现场资料进行核实。\n\n| 区域 | 面积 | 变化 |\n| --- | ---: | --- |\n| 北部河道 | 12.8 km² | 增加 |\n| 南部湖区 | 8.6 km² | 稳定 |\n\n### 后续步骤\n\n1. 检查输入影像\n   - 排除云和阴影\n   - 校验坐标系\n2. 计算水体指数\n\n```python\nmndwi = (green - swir) / (green + swir)\n```\n\n> 这是界面测试用的示例数据。'}]}],
 ['b'.repeat(32), {archive_id:'b'.repeat(32),session_id:'old-b',title:'植被指数对比',updated_at:'2026-11-10T08:00:00Z',messages:[{role:'user',content:'对比两期植被指数'},{role:'assistant',content:'示例对话。'}]}],
]);
window.__calls = [];
AIAPI.listFunctions = async () => ({functions:[]});
AIAPI.listConversations = async () => ({conversations:[...records.values()]});
AIAPI.getConversation = async id => ({conversation:records.get(id)});
AIAPI.restoreConversation = async () => ({});
AIAPI.deleteConversation = async id => {records.delete(id); return {};};
AIAPI.archiveConversation = async payload => {const previous=records.get(payload.archive_id); const record={...payload,title:previous?.title_edited ? previous.title : payload.title,title_edited:previous?.title_edited || false,note:previous?.note || '',pinned:previous?.pinned || false,pinned_at:previous?.pinned_at || null,updated_at:new Date().toISOString(),message_count:payload.messages.length}; records.set(payload.archive_id,record); return {conversation:record};};
AIAPI.updateConversation = async (id, details) => {const record={...records.get(id),...details,title_edited:true}; records.set(id,record); return {conversation:record};};
AIAPI.pinConversation = async (id, pinned) => {const record={...records.get(id),pinned,pinned_at:pinned ? new Date().toISOString() : null}; records.set(id,record); return {conversation:record};};
AIAPI.exportConversation = async id => {const record=records.get(id); return structuredClone({format:'rsmarking.conversation',version:1,conversation:{title:record.title,note:record.note || '',pinned:record.pinned || false,messages:record.messages}});};
const createRecord = details => {const id=crypto.randomUUID().replaceAll('-',''); const record={...structuredClone(details),archive_id:id,session_id:'new-'+id,title_edited:true,updated_at:new Date().toISOString()}; records.set(id,record); return {conversation:record};};
AIAPI.importConversation = async bundle => createRecord({...bundle.conversation,pinned_at:bundle.conversation.pinned ? new Date().toISOString() : null});
AIAPI.branchConversation = async (id, payload) => {const record=records.get(id); return createRecord({title:payload.title || record.title+' / branch',note:record.note || '',pinned:false,messages:record.messages.slice(0,payload.message_index == null ? undefined : payload.message_index+1)});};
AIAPI.agent = async payload => {
    window.__calls.push(payload);
    if (window.__interruptNext) {
        window.__interruptNext = false;
        return { status: 'interrupted', session_id: payload.session_id, answer: '请求中断，已保存执行记录。', steps: [], used_tools: [] };
    }
    const workflow = payload.execution_mode === 'collaborative' ? {
        stage: 'success', round: 0, model_calls: 5,
        events: [
            { agent: 'planner', status: 'completed', summary: '检查影像并拆解任务' },
            { agent: 'executor', status: 'completed', summary: '已生成海岸线' },
            { agent: 'verifier', status: 'accepted', summary: '已检查实际输出' },
        ],
    } : null;
    return { session_id: payload.session_id, answer: '## 已完成\n\n**Markdown** 正常显示。\n\n- [x] 任务完成', steps: [], used_tools: [], workflow };
};
const ai = new AIModule({});
window.RS = {aiExecute:()=>ai.execute(),closeAIModal:()=>ai.closeModal(),aiStartNewAgentChat:()=>ai.startNewAgentChat()};
window.__ai = ai;
ai.openModal();
applyTranslations(document);
</script></body></html>
